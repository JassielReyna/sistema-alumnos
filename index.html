<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso Escolar</title>
    
    <!-- Librerías -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>

    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; margin: 0; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        h3 { color: #7f8c8d; margin-top: 0; margin-bottom: 20px; font-weight: normal; }
        
        #status { margin: 0 auto 15px auto; padding: 15px; font-weight: bold; font-size: 1.2em; color: #2980b9; background-color: white; border-radius: 8px; max-width: 450px; box-shadow: 0px 4px 10px rgba(0,0,0,0.08); }
        #reader { width: 100%; max-width: 450px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        
        /* Controles y Filtros de Reportes */
        .panel-reportes { margin-top: 30px; background: white; padding: 20px; border-radius: 8px; max-width: 900px; margin-left: auto; margin-right: auto; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        .controles-filtro { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 15px; margin-bottom: 20px; align-items: center; }
        .controles-filtro input, .controles-filtro select { padding: 10px; font-size: 15px; border-radius: 5px; border: 1px solid #ccc; }
        
        .btn-principal { padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; border: none; transition: 0.3s; color: white; }
        .btn-toggle { background-color: #34495e; width: 100%; }
        .btn-toggle:hover { background-color: #2c3e50; }
        .btn-generar { background-color: #2980b9; }
        .btn-generar:hover { background-color: #1f618d; }
        .btn-excel { background-color: #27ae60; display: none; }
        .btn-excel:hover { background-color: #1e8449; }

        /* Tabla */
        #contenedor-tabla { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        td.nombre-alumno { text-align: left; font-weight: bold; }
        .hora-entrada { color: #27ae60; font-weight: bold; }
        .hora-salida { color: #2980b9; font-weight: bold; }

        .btn-wa { background-color: #25D366; color: white; padding: 6px 12px; text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 12px; display: inline-block; }
        .btn-wa:hover { background-color: #1ebe57; }

        /* Estilos del Escáner */
        #reader select { padding: 10px !important; font-size: 15px !important; margin-bottom: 20px !important; border-radius: 5px !important; width: 90% !important; max-width: 300px !important; border: 2px solid #ccc !important; }
        #reader button { padding: 12px 20px !important; font-size: 15px !important; margin: 10px !important; border-radius: 5px !important; background-color: #2980b9 !important; color: white !important; border: none !important; font-weight: bold !important; cursor: pointer !important; }
        #reader a { display: none !important; }
    </style>
</head>
<body>

    <h1>🏫 Control de Acceso General</h1>
    <h3>Escáner de Puerta Principal</h3>
    
    <div id="status">Iniciando sistema...</div>
    <div id="reader"></div>

    <!-- PANEL DE REPORTES Y FILTROS -->
    <div class="panel-reportes">
        <button id="btn-toggle" class="btn-principal btn-toggle" onclick="toggleReportes()">📊 Ver Registros de Asistencia</button>
        
        <div id="seccion-reportes" style="display: none;">
            <div class="controles-filtro">
                <div>
                    <label><strong>Fecha: </strong></label>
                    <input type="date" id="filtro-fecha">
                </div>
                <div>
                    <label><strong>Grupo: </strong></label>
                    <select id="filtro-grupo" onchange="generarTabla()">
                        <option value="">Todos los grupos</option>
                    </select>
                </div>
                <button class="btn-principal btn-generar" onclick="generarTabla()">Generar Tabla</button>
                <button id="btn-descarga-excel" class="btn-principal btn-excel" onclick="descargarExcel()">⬇️ Descargar Excel</button>
            </div>

            <div id="contenedor-tabla">
                <table>
                    <thead>
                        <tr>
                            <th>Grupo</th>
                            <th>Alumno</th>
                            <th>Entrada</th>
                            <th>Salida</th>
                            <th>Aviso Directo</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-asistencias">
                        <tr><td colspan="5">Selecciona una fecha y presiona "Generar Tabla"</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // --- LLAVES DE SUPABASE ---
        const URL_PROYECTO = 'https://kqdfoqityolwrxvpgblu.supabase.co';
        const LLAVE_PUBLICA = 'sb_publishable_rcACwicJA2Guh2Pth55S7g_qs8VcoI9';
        const clienteSupabase = supabase.createClient(URL_PROYECTO, LLAVE_PUBLICA);

        // --- TOKEN DE TELEGRAM ---
        const PARTE_1_TOKEN = '8887434969'; 
        const PARTE_2_TOKEN = 'AAH7a_QS4GqqjdFu0xnW1VCBVpP6IDPstn4'; 
        const TOKEN_TELEGRAM = PARTE_1_TOKEN + ':' + PARTE_2_TOKEN;

        let datosTablaActual = []; 

        // Generar fecha en formato estricto YYYY-MM-DD
        function obtenerFechaLocal() {
            const hoy = new Date();
            const año = hoy.getFullYear();
            const mes = String(hoy.getMonth() + 1).padStart(2, '0');
            const dia = String(hoy.getDate()).padStart(2, '0');
            return `${año}-${mes}-${dia}`;
        }
        document.getElementById('filtro-fecha').value = obtenerFechaLocal();

        // --- SISTEMA DE SONIDO ---
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContextClass();
        document.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); });

        function reproducirSonido(tipo) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                const ahora = audioCtx.currentTime;
                if (tipo === 'exito') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(987.77, ahora); osc.frequency.setValueAtTime(1318.51, ahora + 0.08);
                    gain.gain.setValueAtTime(0.35, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.22);
                    osc.start(ahora); osc.stop(ahora + 0.22);
                } else if (tipo === 'alerta') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(440, ahora); osc.frequency.setValueAtTime(330, ahora + 0.12);
                    gain.gain.setValueAtTime(0.35, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.28);
                    osc.start(ahora); osc.stop(ahora + 0.28);
                } else if (tipo === 'error') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, ahora);
                    gain.gain.setValueAtTime(0.3, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.35);
                    osc.start(ahora); osc.stop(ahora + 0.35);
                }
            } catch (e) {}
        }

        const statusText = document.getElementById('status');
        let ultimoEscaneo = ""; 
        let procesandoEscaneo = false;
        
        const escaner = new Html5QrcodeScanner("reader", { 
            fps: 10, qrbox: function(vw, vh) { return { width: Math.floor(Math.min(vw, vh) * 0.85), height: Math.floor(Math.min(vw, vh) * 0.85) }; }
        }, false);

        // --- CARGAR GRUPOS EN EL FILTRO ---
        async function cargarGrupos() {
            const { data } = await clienteSupabase.from('alumnos_escuela').select('grupo');
            if (data) {
                const gruposUnicos = [...new Set(data.map(a => a.grupo))].sort();
                const select = document.getElementById('filtro-grupo');
                gruposUnicos.forEach(g => { select.innerHTML += `<option value="${g}">${g}</option>`; });
            }
        }

        // --- MOSTRAR/OCULTAR REPORTES ---
        function toggleReportes() {
            const seccion = document.getElementById('seccion-reportes');
            const btn = document.getElementById('btn-toggle');
            if (seccion.style.display === 'none') {
                seccion.style.display = 'block';
                btn.innerText = "🔼 Ocultar Registros";
                generarTabla(); 
            } else {
                seccion.style.display = 'none';
                btn.innerText = "📊 Ver Registros de Asistencia";
            }
        }

        async function enviarTelegram(chatId, mensaje) {
            if (!chatId || PARTE_1_TOKEN === 'PEGAR_AQUI_LOS_NUMEROS') return;
            const url = `https://api.telegram.org/bot${TOKEN_TELEGRAM}/sendMessage`;
            try { await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ chat_id: chatId, text: mensaje }) }); } catch (e) {}
        }

        // --- GENERAR TABLA FILTRADA (CRUCE MANUAL Y SEGURO) ---
        async function generarTabla() {
            const fecha = document.getElementById('filtro-fecha').value;
            const grupoFiltro = document.getElementById('filtro-grupo').value;
            const tablaCuerpo = document.getElementById('tabla-asistencias');
            const btnExcel = document.getElementById('btn-descarga-excel');

            if (!fecha) return;

            tablaCuerpo.innerHTML = "<tr><td colspan='5'>Cargando datos...</td></tr>";
            btnExcel.style.display = 'none';

            try {
                // 1. Obtener los registros de asistencia de la fecha seleccionada
                const { data: asistencias, error: errorAsistencias } = await clienteSupabase
                    .from('asistencias_escuela')
                    .select('alumno_id, hora_entrada, hora_salida')
                    .eq('fecha', fecha)
                    .order('hora_entrada', { ascending: false });

                if (errorAsistencias || !asistencias || asistencias.length === 0) {
                    tablaCuerpo.innerHTML = "<tr><td colspan='5'>No hay registros para esta fecha.</td></tr>";
                    datosTablaActual = [];
                    return;
                }

                // 2. Extraer los IDs únicos de los alumnos que asistieron
                const idsAlumnos = [...new Set(asistencias.map(a => a.alumno_id))];

                // 3. Obtener los datos de esos alumnos (filtrando por grupo si es necesario)
                let queryAlumnos = clienteSupabase
                    .from('alumnos_escuela')
                    .select('id, nombre, paterno, materno, grupo, celular')
                    .in('id', idsAlumnos);

                if (grupoFiltro !== "") {
                    queryAlumnos = queryAlumnos.eq('grupo', grupoFiltro);
                }

                const { data: alumnos, error: errorAlumnos } = await queryAlumnos;

                if (errorAlumnos || !alumnos || alumnos.length === 0) {
                    tablaCuerpo.innerHTML = "<tr><td colspan='5'>No hay registros para este grupo.</td></tr>";
                    datosTablaActual = [];
                    return;
                }

                // 4. Cruzar los datos y construir la tabla
                datosTablaActual = [];
                tablaCuerpo.innerHTML = ""; 

                asistencias.forEach(asistencia => {
                    const alumno = alumnos.find(a => a.id === asistencia.alumno_id);
                    
                    if (alumno) { // Solo si el alumno coincide con el filtro de grupo
                        // Guardar la estructura para el Excel
                        datosTablaActual.push({
                            hora_entrada: asistencia.hora_entrada,
                            hora_salida: asistencia.hora_salida,
                            alumnos_escuela: alumno
                        });

                        const nombreCompleto = `${alumno.paterno} ${alumno.materno} ${alumno.nombre}`;
                        const celularLimpio = alumno.celular ? alumno.celular.replace(/\D/g, '') : '';
                        
                        let linkWA = "Sin número";
                        if (celularLimpio.length >= 10) {
                            const mensajeWA = encodeURIComponent(`🏫 Aviso Escolar: Buen día, le informamos que ${alumno.nombre} ha registrado un movimiento en la entrada.`);
                            linkWA = `<a href="https://wa.me/52${celularLimpio}?text=${mensajeWA}" target="_blank" class="btn-wa">📲 WhatsApp</a>`;
                        }

                        tablaCuerpo.innerHTML += `
                            <tr>
                                <td><strong>${alumno.grupo}</strong></td>
                                <td class="nombre-alumno">${nombreCompleto}</td>
                                <td class="hora-entrada">${asistencia.hora_entrada || "---"}</td>
                                <td class="hora-salida">${asistencia.hora_salida || "---"}</td>
                                <td>${linkWA}</td>
                            </tr>`;
                    }
                });

                if (datosTablaActual.length === 0) {
                     tablaCuerpo.innerHTML = "<tr><td colspan='5'>No hay registros para este grupo.</td></tr>";
                } else {
                     btnExcel.style.display = 'inline-block';
                }

            } catch (error) {
                console.error("Error generando tabla:", error);
                tablaCuerpo.innerHTML = "<tr><td colspan='5'>Error al cargar los datos.</td></tr>";
            }
        }

        // --- ESCANEO EXITOSO ---
        async function onScanSuccess(codigoEscaneado) {
            if (procesandoEscaneo || codigoEscaneado === ultimoEscaneo) return;
            procesandoEscaneo = true;
            ultimoEscaneo = codigoEscaneado;

            statusText.innerText = "Procesando...";
            statusText.style.color = "orange";

            try {
                const { data: alumno, error: errorAlumno } = await clienteSupabase
                    .from('alumnos_escuela')
                    .select('*').eq('codigo', codigoEscaneado).single();

                if (errorAlumno || !alumno) {
                    reproducirSonido('error'); statusText.innerText = "❌ Error: Alumno no encontrado."; statusText.style.color = "red";
                    reiniciarEscaner(); return;
                }

                const fechaHoyEstricta = obtenerFechaLocal();
                const horaActual = new Date().toLocaleTimeString('en-GB'); 

                const { data: regHoy } = await clienteSupabase.from('asistencias_escuela').select('*').eq('alumno_id', alumno.id).eq('fecha', fechaHoyEstricta).limit(1); 
                const asistencia = (regHoy && regHoy.length > 0) ? regHoy[0] : null;

                if (!asistencia) {
                    await clienteSupabase.from('asistencias_escuela').insert([{ alumno_id: alumno.id, fecha: fechaHoyEstricta, hora_entrada: horaActual }]);
                    reproducirSonido('exito');
                    statusText.innerText = `✅ ENTRADA: ${alumno.nombre} ${alumno.paterno} ${alumno.materno}`; statusText.style.color = "green";
                    enviarTelegram(alumno.telegram_chat_id, `🏫 AVISO ESCOLAR\n\n🟢 ENTRADA REGISTRADA\nAlumno(a): ${alumno.nombre} ${alumno.paterno} ${alumno.materno}\nGrupo: ${alumno.grupo}\nHora: ${horaActual}`);
                } else if (!asistencia.hora_salida) {
                    await clienteSupabase.from('asistencias_escuela').update({ hora_salida: horaActual }).eq('id', asistencia.id);
                    reproducirSonido('exito');
                    statusText.innerText = `👋 SALIDA: ${alumno.nombre} ${alumno.paterno} ${alumno.materno}`; statusText.style.color = "#2980b9";
                    enviarTelegram(alumno.telegram_chat_id, `🏫 AVISO ESCOLAR\n\n🔵 SALIDA REGISTRADA\nAlumno(a): ${alumno.nombre} ${alumno.paterno} ${alumno.materno}\nGrupo: ${alumno.grupo}\nHora: ${horaActual}`);
                } else {
                    reproducirSonido('alerta');
                    statusText.innerText = `⚠️ ${alumno.nombre} ${alumno.paterno} ya registró su salida hoy.`;
                    statusText.style.color = "#d35400";
                }
                
                // Actualiza la tabla automáticamente si está abierta en el día de hoy
                if(document.getElementById('filtro-fecha').value === fechaHoyEstricta && document.getElementById('seccion-reportes').style.display !== 'none') { 
                    generarTabla(); 
                }

            } catch (error) {}
            reiniciarEscaner();
        }

        function onScanFailure(error) {}
        function reiniciarEscaner() { setTimeout(() => { ultimoEscaneo = ""; procesandoEscaneo = false; statusText.innerText = "Cámara lista. Escanea el siguiente QR."; statusText.style.color = "#2980b9"; }, 2500); }

        // --- EXPORTAR A EXCEL ---
        function descargarExcel() {
            if (datosTablaActual.length === 0) return;
            const fecha = document.getElementById('filtro-fecha').value;
            const grupo = document.getElementById('filtro-grupo').value || "Todos";

            const bordeDelgado = { top: {style:"thin", color:{rgb:"CCCCCC"}}, bottom: {style:"thin", color:{rgb:"CCCCCC"}}, left: {style:"thin", color:{rgb:"CCCCCC"}}, right: {style:"thin", color:{rgb:"CCCCCC"}} };
            const estiloEncabezado = { fill: { fgColor: { rgb: "2C3E50" } }, font: { color: { rgb: "FFFFFF" }, bold: true }, alignment: { horizontal: "center", vertical: "center" }, border: bordeDelgado };

            const filasExcel = [
                [{ v: "Grupo", t: "s", s: estiloEncabezado }, { v: "Nombre del Alumno", t: "s", s: estiloEncabezado }, { v: "Hora de Entrada", t: "s", s: estiloEncabezado }, { v: "Hora de Salida", t: "s", s: estiloEncabezado }]
            ];

            datosTablaActual.forEach(registro => {
                const al = registro.alumnos_escuela;
                const nombreCompleto = `${al.paterno} ${al.materno} ${al.nombre}`;
                filasExcel.push([
                    { v: al.grupo, t: "s", s: { alignment: { horizontal: "center" }, border: bordeDelgado } },
                    { v: nombreCompleto, t: "s", s: { alignment: { horizontal: "left" }, border: bordeDelgado } },
                    { v: registro.hora_entrada || "-", t: "s", s: { font: { color: {rgb: "27AE60"}, bold: true }, alignment: { horizontal: "center" }, border: bordeDelgado } },
                    { v: registro.hora_salida || "-", t: "s", s: { font: { color: {rgb: "2980B9"}, bold: true }, alignment: { horizontal: "center" }, border: bordeDelgado } }
                ]);
            });

            const hoja = XLSX.utils.aoa_to_sheet(filasExcel);
            hoja['!cols'] = [{ wch: 10 }, { wch: 40 }, { wch: 18 }, { wch: 18 }];
            
            const libro = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(libro, hoja, "Asistencias");
            XLSX.writeFile(libro, `Asistencias_Escuela_${grupo}_${fecha}.xlsx`);
        }

        // --- TRADUCTOR PROFUNDO DE CÁMARA ---
        setInterval(() => {
            document.querySelectorAll('button').forEach(btn => {
                if (btn.innerText.includes("Request Camera Permissions")) btn.innerText = "Permitir acceso a la cámara";
                if (btn.innerText.includes("Start Scanning")) btn.innerText = "Iniciar cámara";
                if (btn.innerText.includes("Stop Scanning")) btn.innerText = "Detener cámara";
            });
            document.querySelectorAll('span').forEach(s => {
                s.childNodes.forEach(n => { if (n.nodeType === 3 && n.nodeValue.includes("Select Camera")) n.nodeValue = "Seleccionar Cámara"; });
            });
            document.querySelectorAll('option').forEach(opt => {
                let texto = opt.innerText.toLowerCase();
                if (texto.includes("facing back") || texto.includes("back camera")) { opt.innerText = "Cámara Trasera"; } 
                else if (texto.includes("facing front") || texto.includes("front camera")) { opt.innerText = "Cámara Frontal"; } 
                else if (texto.includes("camera")) { opt.innerText = opt.innerText.replace(/camera/i, "Cámara"); }
            });
        }, 500);
        
        escaner.render(onScanSuccess, onScanFailure);
        cargarGrupos();
    </script>
</body>
</html>
