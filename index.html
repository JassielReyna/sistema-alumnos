<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Acceso Escolar</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; margin: 0; }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        h3 { color: #7f8c8d; margin-top: 0; margin-bottom: 20px; font-weight: normal; }
        
        #status { 
            margin: 0 auto 15px auto; padding: 15px; font-weight: bold; font-size: 1.2em; 
            color: #2980b9; background-color: white; border-radius: 8px; max-width: 450px; 
            box-shadow: 0px 4px 10px rgba(0,0,0,0.08); 
        }

        #reader { 
            width: 100%; max-width: 450px; margin: 0 auto; background: white; 
            padding: 10px; border-radius: 8px; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); 
        }
        
        #contenedor-tabla { margin-top: 30px; overflow-x: auto; }
        table { width: 100%; max-width: 900px; margin: 0 auto; border-collapse: collapse; background: white; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: center; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        td.nombre-alumno { text-align: left; font-weight: bold; }
        .hora-entrada { color: #27ae60; font-weight: bold; }
        .hora-salida { color: #2980b9; font-weight: bold; }

        .btn-wa { 
            background-color: #25D366; color: white; padding: 6px 12px; 
            text-decoration: none; border-radius: 5px; font-weight: bold; font-size: 13px; display: inline-block;
        }
        .btn-wa:hover { background-color: #1ebe57; }

        #reader select { padding: 12px !important; font-size: 16px !important; margin-bottom: 20px !important; border-radius: 5px !important; width: 90% !important; max-width: 300px !important; border: 2px solid #ccc !important; }
        #reader button { padding: 15px 25px !important; font-size: 16px !important; margin: 10px !important; border-radius: 8px !important; background-color: #2980b9 !important; color: white !important; border: none !important; font-weight: bold !important; cursor: pointer !important; transition: 0.3s !important; }
        #reader button:hover { background-color: #1f618d !important; }
        #reader a { display: none !important; }
    </style>
</head>
<body>

    <h1>🏫 Control de Acceso General</h1>
    <h3>Escáner Principal</h3>
    
    <div id="status">Iniciando sistema...</div>
    <div id="reader"></div>

    <div id="contenedor-tabla">
        <h2>Registros de Hoy</h2>
        <table>
            <thead>
                <tr>
                    <th>Grupo</th>
                    <th>Alumno</th>
                    <th>Entrada</th>
                    <th>Salida</th>
                    <th>Aviso Directo</th>
                </tr>
            </thead>
            <tbody id="tabla-asistencias">
                <tr><td colspan="5">Cargando datos...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
        // --- LLAVES DE SUPABASE ---
        const URL_PROYECTO = 'https://kqdfoqityolwrxvpgblu.supabase.co';
        const LLAVE_PUBLICA = 'sb_publishable_rcACwicJA2Guh2Pth55S7g_qs8VcoI9';
        const clienteSupabase = supabase.createClient(URL_PROYECTO, LLAVE_PUBLICA);

        // --- TRUCO PARA OCULTAR EL TOKEN A GITHUB ---
        // Pega aquí tu NUEVO token generado por BotFather, pero pártelo en dos donde están los dos puntos (:)
        const PARTE_1_TOKEN = '8887434969'; // Ejemplo: '7238472910'
        const PARTE_2_TOKEN = 'AAH7a_QS4GqqjdFu0xnW1VCBVpP6IDPstn4'; // Ejemplo: 'AAFd34Kjhsdf8934kjdfhasdfkjh'
        const TOKEN_TELEGRAM = PARTE_1_TOKEN + ':' + PARTE_2_TOKEN;

        // --- SISTEMA DE SONIDO INTEGRADO ---
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContextClass();

        document.addEventListener('click', () => { if (audioCtx.state === 'suspended') audioCtx.resume(); });

        function reproducirSonido(tipo) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const ahora = audioCtx.currentTime;

                if (tipo === 'exito') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(987.77, ahora); osc.frequency.setValueAtTime(1318.51, ahora + 0.08);
                    gain.gain.setValueAtTime(0.35, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.22);
                    osc.start(ahora); osc.stop(ahora + 0.22);
                } else if (tipo === 'alerta') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(440, ahora); osc.frequency.setValueAtTime(330, ahora + 0.12);
                    gain.gain.setValueAtTime(0.35, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.28);
                    osc.start(ahora); osc.stop(ahora + 0.28);
                } else if (tipo === 'error') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, ahora);
                    gain.gain.setValueAtTime(0.3, ahora); gain.gain.exponentialRampToValueAtTime(0.01, ahora + 0.35);
                    osc.start(ahora); osc.stop(ahora + 0.35);
                }
            } catch (e) {}
        }

        const statusText = document.getElementById('status');
        let ultimoEscaneo = ""; 
        let procesandoEscaneo = false;
        
        const escaner = new Html5QrcodeScanner("reader", { 
            fps: 10, qrbox: function(vw, vh) { return { width: Math.floor(Math.min(vw, vh) * 0.85), height: Math.floor(Math.min(vw, vh) * 0.85) }; }
        }, false);

        // --- FUNCIÓN PARA ENVIAR TELEGRAM ---
        async function enviarTelegram(chatId, mensaje) {
            if (!chatId || PARTE_1_TOKEN === 'PEGAR_AQUI_LOS_NUMEROS') return;
            const url = `https://api.telegram.org/bot${TOKEN_TELEGRAM}/sendMessage`;
            try {
                await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: chatId, text: mensaje })
                });
            } catch (e) { console.error("Error Telegram:", e); }
        }

        async function cargarAsistencias() {
            const ahora = new Date();
            const fechaHoy = ahora.toLocaleDateString('sv-SE'); 
            
            // CORRECCIÓN: Buscando la columna 'celular'
            const { data, error } = await clienteSupabase
                .from('asistencias_escuela')
                .select('hora_entrada, hora_salida, alumnos_escuela(nombre, paterno, materno, grupo, celular)')
                .eq('fecha', fechaHoy)
                .order('hora_entrada', { ascending: false });

            const tablaCuerpo = document.getElementById('tabla-asistencias');
            tablaCuerpo.innerHTML = ""; 
            if (error || !data || data.length === 0) {
                tablaCuerpo.innerHTML = "<tr><td colspan='5'>Aún no hay registros hoy.</td></tr>";
                return;
            }

            data.forEach((registro) => {
                const al = registro.alumnos_escuela;
                const nombreCompleto = `${al.nombre} ${al.paterno} ${al.materno}`;
                // CORRECCIÓN: Usando al.celular
                const celularLimpio = al.celular ? al.celular.replace(/\D/g, '') : '';
                
                let linkWA = "Sin número";
                if (celularLimpio.length >= 10) {
                    const mensajeWA = encodeURIComponent(`🏫 Aviso Escolar: Buen día, le informamos que ${al.nombre} ha registrado un movimiento en la entrada de la escuela.`);
                    linkWA = `<a href="https://wa.me/52${celularLimpio}?text=${mensajeWA}" target="_blank" class="btn-wa">📲 WhatsApp</a>`;
                }

                tablaCuerpo.innerHTML += `
                    <tr>
                        <td><strong>${al.grupo}</strong></td>
                        <td class="nombre-alumno">${nombreCompleto}</td>
                        <td class="hora-entrada">${registro.hora_entrada || "---"}</td>
                        <td class="hora-salida">${registro.hora_salida || "---"}</td>
                        <td>${linkWA}</td>
                    </tr>`;
            });
        }

        async function onScanSuccess(codigoEscaneado) {
            if (procesandoEscaneo || codigoEscaneado === ultimoEscaneo) return;
            procesandoEscaneo = true;
            ultimoEscaneo = codigoEscaneado;

            statusText.innerText = "Buscando alumno...";
            statusText.style.color = "orange";

            try {
                // CORRECCIÓN: Buscando por la columna 'codigo' en vez de 'codigo_qr'
                const { data: alumno, error: errorAlumno } = await clienteSupabase
                    .from('alumnos_escuela')
                    .select('*')
                    .eq('codigo', codigoEscaneado)
                    .single();

                if (errorAlumno || !alumno) {
                    reproducirSonido('error');
                    statusText.innerText = "❌ Error: Alumno no encontrado.";
                    statusText.style.color = "red";
                    reiniciarEscaner();
                    return;
                }

                const ahora = new Date();
                const fechaHoy = ahora.toLocaleDateString('sv-SE'); 
                const horaActual = ahora.toLocaleTimeString('en-GB'); 

                const { data: registrosHoy, error: errorBusqueda } = await clienteSupabase
                    .from('asistencias_escuela')
                    .select('*')
                    .eq('alumno_id', alumno.id)
                    .eq('fecha', fechaHoy)
                    .limit(1); 

                const asistencia = (registrosHoy && registrosHoy.length > 0) ? registrosHoy[0] : null;

                if (!asistencia) {
                    await clienteSupabase.from('asistencias_escuela')
                        .insert([{ alumno_id: alumno.id, fecha: fechaHoy, hora_entrada: horaActual }]);
                    
                    reproducirSonido('exito');
                    statusText.innerText = `✅ ENTRADA: ${alumno.nombre} ${alumno.paterno}`;
                    statusText.style.color = "green";

                    enviarTelegram(alumno.telegram_chat_id, `🏫 AVISO ESCOLAR\n\n🟢 ENTRADA REGISTRADA\nAlumno(a): ${alumno.nombre} ${alumno.paterno}\nGrupo: ${alumno.grupo}\nHora: ${horaActual}`);

                } else if (!asistencia.hora_salida) {
                    await clienteSupabase.from('asistencias_escuela')
                        .update({ hora_salida: horaActual })
                        .eq('id', asistencia.id);

                    reproducirSonido('exito');
                    statusText.innerText = `👋 SALIDA: ${alumno.nombre} ${alumno.paterno}`;
                    statusText.style.color = "#2980b9";

                    enviarTelegram(alumno.telegram_chat_id, `🏫 AVISO ESCOLAR\n\n🔵 SALIDA REGISTRADA\nAlumno(a): ${alumno.nombre} ${alumno.paterno}\nGrupo: ${alumno.grupo}\nHora: ${horaActual}`);

                } else {
                    reproducirSonido('alerta');
                    statusText.innerText = `⚠️ ${alumno.nombre} ya registró su salida hoy.`;
                    statusText.style.color = "#d35400";
                }
                
                cargarAsistencias(); 
            } catch (error) {
                reproducirSonido('error');
                statusText.innerText = "Error de conexión.";
                statusText.style.color = "red";
            }
            reiniciarEscaner();
        }

        function onScanFailure(error) {}

        function reiniciarEscaner() {
            setTimeout(() => { 
                ultimoEscaneo = ""; 
                procesandoEscaneo = false;
                statusText.innerText = "Cámara lista. Escanea el siguiente QR.";
                statusText.style.color = "#2980b9";
            }, 2500); 
        }

        setInterval(() => {
            document.querySelectorAll('button').forEach(btn => {
                if (btn.innerText.includes("Request Camera Permissions")) btn.innerText = "Permitir acceso a la cámara";
                if (btn.innerText.includes("Start Scanning")) btn.innerText = "Iniciar cámara";
                if (btn.innerText.includes("Stop Scanning")) btn.innerText = "Detener cámara";
            });
            document.querySelectorAll('span').forEach(s => {
                s.childNodes.forEach(n => {
                    if (n.nodeType === 3 && n.nodeValue.includes("Select Camera")) n.nodeValue = "Seleccionar Cámara";
                });
            });
        }, 500);
        
        escaner.render(onScanSuccess, onScanFailure);
        cargarAsistencias(); 
    </script>
</body>
</html>
